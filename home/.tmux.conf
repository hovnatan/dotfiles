set-option -g prefix C-a

set-option -g default-command fish
set-option -g default-terminal "tmux-256color"

# Array options below are set at fixed indices from 100 up, not appended
# with -ga: a reload (prefix r) re-runs this file, and -ga added another
# copy of every entry each time (update-environment[13..33] held three).
# Plain -g on the whole option would instead replace tmux's defaults
# (SSH_AUTH_SOCK..., xterm*:clipboard:ccolour:cstyle:focus:title), which
# sit at the low indices and stay untouched.

# Refresh VS Code integration vars from the attaching client, like the
# built-in SSH_* handling: their socket paths die with each VS Code window
set-option -g update-environment[100] VSCODE_IPC_HOOK_CLI
set-option -g update-environment[101] VSCODE_GIT_IPC_HANDLE
set-option -g update-environment[102] GIT_ASKPASS
set-option -g update-environment[103] TERM_PROGRAM
set-option -g update-environment[104] TERM_PROGRAM_VERSION
set-option -g update-environment[105] BROWSER
# ...and which terminal the client draws in (iTerm2 exports it, ssh forwards
# LC_*), read by ~/.dotfiles/home/.config/tmux/report-attach.sh
set-option -g update-environment[106] LC_TERMINAL
# Truecolor for every outer terminal. This was ",$TERM*:RGB", but $TERM is
# the server's own environment, empty when systemd starts it
# (claude-tmux.service), so it already read "*:RGB" there.
set-option -g terminal-features[100] "*:RGB"
# Pass OSC 8 hyperlinks through (tmux >= 3.4 drops them otherwise): Claude Code
# draws markdown links as label-only OSC 8, so without this Ghostty has no url
# to open.  Open them with Cmd+Shift+click: `mouse on` below makes tmux capture
# plain clicks, and Shift is Ghostty's bypass for mouse capture.
set-option -g terminal-features[101] "*:hyperlinks"
set-option -g history-limit 100000
set-option -g focus-events on
set-option -g history-file ~/.local/share/tmux_history
set-option -g xterm-keys on
set-option -g escape-time 10
set-option -g wrap-search off
set-option -g mode-keys vi
set-option -g set-clipboard on     # sync tmux buffer with macOS clipboard
set-option -g -q mouse on

set-option -g exit-empty on

# Command-finish alerts: zsh and fish ring the bell for commands taking >1s
# (.zshrc.shared, fish config.fish), and Claude Code rings its own
# (preferredNotifChannel terminal_bell in ~/.claude/settings.json); pass it
# through to the outer terminal from any window.
# These are tmux defaults, set explicitly since the feature depends on them.
set-option -wg monitor-bell on
set-option -g bell-action any
set-option -g visual-bell off
# Let panes send wrapped escape sequences through to the outer terminal:
# chafa's kitty-graphics images (fish functions/chafa.fish). Only while the
# pane is visible; `all` would also pass them from hidden panes.
set-option -g allow-passthrough on
# Sixel images (chafa -f sixels, from a client tmux detects sixel on, e.g.
# iTerm2) arrive as one escape sequence, and tmux silently drops any
# sequence over input-buffer-size (default 1 MB): a full-pane screenshot is
# ~1.9 MB of sixel, so it never appeared. Kitty passthrough is unaffected,
# chafa sends it in 4 KB chunks.
set-option -s input-buffer-size 16777216

# Claude Code drops its mobile push while the terminal reports focus, and
# an abruptly killed client (closed VS Code tab, dropped SSH) never sends
# the focus-out a graceful detach does -- the pane then looks watched
# forever and every push is suppressed. When a client goes away or
# switches session, synthesize the missing focus-out in every Claude Code
# pane of every clientless session (see the script's header).
set-hook -g client-detached 'run-shell "~/.dotfiles/home/.config/tmux/focus-out-unattached.sh #{socket_path}"'
set-hook -g client-session-changed 'run-shell "~/.dotfiles/home/.config/tmux/focus-out-unattached.sh #{socket_path}"'
# a session hosting a Claude Code conversation named "<hostname>/<name>[/<task>]"
# is renamed "<name>[/<task>]" whenever that name changes (Naming in
# scripts/claude_tmux_run.sh); other pane titles leave sessions alone
set-hook -g pane-title-changed 'run-shell -b "~/.dotfiles/home/.config/tmux/sync-session-name.sh #{q:socket_path} #{q:session_id} #{q:session_name} #{q:pane_title}"'
# on the claude socket, what a pane left running in the background ends
# with it: the systemd scope of every pane gone is stopped (see the
# script's header), on whichever hook a close fires (tested 2026-10-28,
# tmux 3.7c):
#   its program exits -> pane-exited      kill-pane      -> after-kill-pane
#   kill-window       -> window-unlinked  kill-session   -> window-unlinked,
#                        (after-kill-window is no hook)     session-closed
# A restart (remain-on-exit, respawn) fires only pane-died: nothing reaped.
# session-closed stays as a backstop beside the cold start's own pass.
set-hook -g session-closed 'run-shell -b "~/.dotfiles/home/.config/tmux/reap-panes.sh #{q:socket_path}"'
set-hook -g pane-exited 'run-shell -b "~/.dotfiles/home/.config/tmux/reap-panes.sh #{q:socket_path}"'
set-hook -g after-kill-pane 'run-shell -b "~/.dotfiles/home/.config/tmux/reap-panes.sh #{q:socket_path}"'
set-hook -g window-unlinked[0] 'run-shell -b "~/.dotfiles/home/.config/tmux/reap-panes.sh #{q:socket_path}"'

# Over ssh the terminal title names this machine: @ssh for set-titles-string
# below, or a host report for an iTerm2 client (see the script's header)
set-hook -g client-attached[0] 'run-shell -b "~/.dotfiles/home/.config/tmux/report-attach.sh #{q:socket_path} #{q:session_id} #{q:client_name} #{q:client_tty} attached"'
set-hook -g client-session-changed[1] 'run-shell -b "~/.dotfiles/home/.config/tmux/report-attach.sh #{q:socket_path} #{q:session_id} #{q:client_name} #{q:client_tty} session-changed"'

# A timeline of what each client's terminal tells tmux: focus in and out, and
# the detach that ends it (attaches and session switches are logged by the
# hook above). The ntfy hook decides "is anybody looking" from the focus
# tmux holds for a client, and a terminal can stop reporting it: iTerm2
# switches focus reports off when it takes the host for changed, and tmux
# asks for them once, at attach. In this log that shows as the focus lines
# of a client stopping while it stays attached (see log-event.sh). The
# client is hook_client, the one the hook ran for (its name is its tty):
# client_tty names whichever client tmux had last, so with two tabs attached
# the lines of both read the same, and a detached client has none left.
set-hook -g client-focus-in 'run-shell -b "~/.dotfiles/home/.config/tmux/log-event.sh focus-in #{q:hook_client} session=#{q:session_name}"'
set-hook -g client-focus-out 'run-shell -b "~/.dotfiles/home/.config/tmux/log-event.sh focus-out #{q:hook_client} session=#{q:session_name}"'
set-hook -g client-detached[1] 'run-shell -b "~/.dotfiles/home/.config/tmux/log-event.sh detached #{q:hook_client} session=#{q:session_name}"'

# Light or dark follows the terminal that is attached. It reports its theme
# at attach and at every switch, and the links that Claude Code's theme and
# zathura read are pointed to match (scripts/appearance.sh). The report comes
# down the connection like a keystroke, so a machine reached over ssh
# follows the one at the keyboard with nothing pushed to it; on a Mac,
# Hammerspoon sets the same value from the system's. Two clients of
# different themes: the one that reported last wins. Output is dropped, as
# tmux would open it in the pane; an error still shows.
set-hook -g client-dark-theme 'run-shell -b "~/.dotfiles/scripts/appearance.sh dark >/dev/null"'
set-hook -g client-light-theme 'run-shell -b "~/.dotfiles/scripts/appearance.sh light >/dev/null"'
# Dim the panes that are not active with a background a shade off the
# terminal's, from gruvbox's own backgrounds so the dim stays warm: bg0_h
# (#1d2021) in dark, bg1 (#ebdbb2) in light. A neutral gray read as blue
# beside gruvbox's cream, and a cool dark one was blue outright. The active
# pane keeps the terminal's own, so a window of one pane is never dimmed:
# bg=terminal, as the active style is laid over window-style and its
# "default" would let the dim through.
# Text a program colours itself (most of Claude Code's) keeps its colour.
# Index 1, after the plain lines above: those replace the whole array.
set-option -g @dim_dark "bg=#1d2021"
set-option -g @dim_light "bg=#ebdbb2"
set-option -wg window-active-style bg=terminal
set-hook -g client-dark-theme[1] 'set-option -wgF window-style "#{@dim_dark}"'
set-hook -g client-light-theme[1] 'set-option -wgF window-style "#{@dim_light}"'
# A terminal reports its theme at attach and on a switch, not at a reload,
# so a reload (prefix r) applies the theme of the client that ran it. A
# server starting from this file has no client: the next attach sets it.
if-shell -F '#{==:#{client_theme},dark}' 'set-option -wgF window-style "#{@dim_dark}"'
if-shell -F '#{==:#{client_theme},light}' 'set-option -wgF window-style "#{@dim_light}"'

# make `tmux ls` show the socket; index 10 keeps the built-in aliases (0-5) intact
set-option -g command-alias[10] 'ls=list-sessions -F "#{socket_path} | #{session_name}: #{session_windows} windows"'

# The status bar, on top in every session: the window list on the left,
# "0 * backend | 1 nvim: init.lua | 2 fish:~/x" (index, space, the name; a
# bar between windows, as between the stats and the date, since names hold
# colons and spaces of their own), the current window in the border orange, a
# window that rang in red; on the right CPU and memory use, then the date,
# time and zone:
#
#   0 * backend | 1 nvim: init.lua       cpu 8.1% mem 74.0% | 03 Nov 17:58 EST
#
# The zone is the tmux server's (EDT in summer, UTC on a VM left at UTC).
# CPU and memory: home/.config/tmux/status-stats.sh, which labels what
# tmux-mem-cpu-load (nix/flake.nix) measures. tmux runs it in the
# background every status-interval (15 s), so the bar never waits on it;
# a failure prints its reason in place of the numbers.
#
# prefix S hides the bar for the current session (a VS Code terminal,
# where the row is unwanted) and shows it again. `status` is a session
# option: every client of the session sees the same bar, so hiding it for
# VS Code hides it in the iTerm2 tab on that session too (tmux has no
# per-client status).
set-option -g status on
set-option -g status-position top
# A server that loaded the rule this replaced (the bar shown only with two
# or more windows, e4f934cd) keeps its hooks and each session's own status
# value across a reload: clear both, so a reload shows the bar everywhere
# (a session hidden with prefix S included). [0] of window-unlinked is the
# pane reaper's, above.
set-hook -gu window-linked[0]
set-hook -gu window-unlinked[1]
run-shell -C "#{S:set-option -t '#{session_id}' -u status ; }"
set-option -g status-left ""
set-option -g status-right "#(~/.dotfiles/home/.config/tmux/status-stats.sh) | %d %b %H:%M %Z "
set-option -g status-right-length 60
set-option -g status-justify left
# gruvbox gray on the terminal's own background, as the pane borders: it
# reads on light and dark alike
set-option -g status-style fg=#928374,bg=default
set-option -g window-status-format "#I #W"
set-option -g window-status-current-format "#I #W"
set-option -g window-status-current-style fg=#d65d0e,bold
set-option -g window-status-bell-style fg=#cc241d,bold
set-option -g window-status-separator " | "
set-option -g renumber-windows on

# the active pane's border in gruvbox orange, the rest in gruvbox gray: both
# read on the light and the dark background (appearance follows the client,
# above). tmux draws borders only between panes, so a lone pane has none.
# With two panes the line they share is coloured on the active pane's half.
set-option -g pane-border-lines heavy
set-option -g pane-border-style fg=#928374
set-option -g pane-active-border-style fg=#d65d0e
set-option -g set-titles on
set-option -g automatic-rename on
set-option -g allow-rename on
# A window is named after the title its program reports (OSC 0/2), as is:
#
#   program        pane_title                window name
#   fish (idle)    "fish:~/.dotfiles"   ->   fish:~/.dotfiles
#   fish running   "make"               ->   make
#   nvim           "nvim: init.lua"     ->   nvim: init.lua
#   Claude Code    "* vm/backend/fix"   ->   * vm/backend/fix  (the glyph is
#                                            its spinner: the bar redraws
#                                            with it while CC works)
#
# A program that sets no title, started straight into a window (`tmux
# new-window htop`), leaves tmux's initial title, the host name; such a
# window is named after the program instead. The rest is tmux's default:
# [tmux] in copy mode, [dead].
set-option -g automatic-rename-format "#{?pane_in_mode,[tmux],#{?#{==:#{pane_title},#{host}},#{pane_current_command},#{pane_title}}}#{?pane_dead,[dead],}"

# the terminal title is the whole session name in brackets, "[main]". On the
# claude socket it is the conversation's full name instead, hostname
# included, "[<host>/backend/fix-ci]": the session follows the conversation's
# task label (see sync-session-name.sh) but drops the hostname, so the title
# puts it back and the tab reads as the prompt bar and claude.ai do. The pane
# title Claude Code sets would only repeat it behind a spinner glyph.
# Elsewhere over ssh (@ssh, set by the hooks above) it leads with this
# machine's short name, as the shells' titles do: "(<host>) [main]" (not for
# iTerm2 clients, whose titles name no host; iterm2_report_host.fish).
# scripts/lib/iterm2_ssh_arrangement.py reads these titles back (TITLED).
set-option -g set-titles-string "#{?#{m:*/claude,#{socket_path}},[#{host}/#{session_name}],#{?@ssh,(#{host_short}) ,}[#{session_name}]}"

unbind -aq -T prefix
unbind -aq -T root
unbind -aq -T copy-mode

bind-key C-a send-prefix
bind-key s choose-tree -Zs
bind-key d detach-client
bind-key [ copy-mode
bind-key ] paste-buffer -p
bind-key : command-prompt

bind-key r source-file ~/.tmux.conf \; display "Reloaded!"

bind-key R attach -d
bind-key k clear-history \; send-keys C-l

bind-key -n WheelUpPane if-shell -F "#{alternate_on}" "send-keys -M" "select-pane -t= \; copy-mode -eu"
# a click makes the pane under it active, and still reaches the program in
# it (tmux's default, which the unbind of the root table above removed)
bind-key -n MouseDown1Pane select-pane -t= \; send-keys -M
bind-key / copy-mode \; command-prompt -p "(search up)" "send -X search-backward \"%%%\""
bind-key C command-prompt -p "Enter session name:" "new-session -s '%%'"

# Windows inside a session (see the status bar block above). In a claude
# session claude stays window 0: it is created first, and renumber-windows
# closes the gaps a closed window leaves. prefix C-s and prefix l both go
# to the window used last; C-s switched to the session used last before,
# which the session picker (prefix s) still reaches.
bind-key c new-window -c "#{pane_current_path}"
bind-key n next-window
bind-key p previous-window
bind-key C-s last-window
bind-key l last-window
bind-key w choose-tree -Zw
bind-key 0 select-window -t :=0
bind-key 1 select-window -t :=1
bind-key 2 select-window -t :=2
bind-key 3 select-window -t :=3
bind-key 4 select-window -t :=4
bind-key 5 select-window -t :=5
bind-key 6 select-window -t :=6
bind-key 7 select-window -t :=7
bind-key 8 select-window -t :=8
bind-key 9 select-window -t :=9
# hide or show this session's status bar, for a view where the row is
# unwanted (a VS Code terminal)
bind-key S if-shell -F "#{==:#{status},off}" "set-option -u status" "set-option status off"
# Cmd-J / Cmd-K: previous / next window. A Mac terminal never passes Cmd to
# the program, so iTerm2 and Ghostty send these two sequences for them
# (scripts/setup_user_symlinks.sh, home/.config/ghostty/config), which tmux
# reads as the keys User0 / User1. Outside tmux fish ignores both. A session
# of one window does nothing, rather than flash "No next window".
# Known gaps: outside tmux, programs that do not skip unknown CSI sequences
# act on them (bash's readline inserts "30001~"; vim and REPLs vary, and
# were not checked); and a tmux nested in a pane (ssh to a box running its
# own) never sees them, as this one takes them first.
#
#   Cmd-J -> \e[5;30001~ -> User0 -> previous-window
#   Cmd-K -> \e[5;30002~ -> User1 -> next-window
set-option -s user-keys[0] "\e[5;30001~"
set-option -s user-keys[1] "\e[5;30002~"
bind-key -n User0 if-shell -F "#{e|>:#{session_windows},1}" previous-window
bind-key -n User1 if-shell -F "#{e|>:#{session_windows},1}" next-window
# restart the claude in view in place, on the same conversation
# (claude_tmux_run.sh restart: a fresh binary after an update, and this
# client stays attached), after a y/n popup listing what it would kill (a
# running turn, background shells, detached processes); y kills them, and
# the verdict goes to the message line. Any server: a claude typed at a
# shell's prompt is resumed at that prompt; on the claude socket, the
# session's claude otherwise.
bind-key C-r run-shell -b "~/.dotfiles/home/.config/tmux/restart-claude.sh ask #{q:socket_path} #{q:session_name} #{q:client_name} #{pane_id}"

bind-key -T copy-mode-vi "v" send -X begin-selection
bind-key -T copy-mode-vi "Y" send-keys -X copy-pipe-and-cancel "tmux paste-buffer"
# Only add the macOS copy-to-clipboard binding if `pbcopy` exists
bind-key -T copy-mode-vi y send-keys -X copy-selection
#   'bind-key -T copy-mode-vi y send-keys -X copy-pipe "xclip -selection clipboard -in"'

# bind-key h select-pane -U
# bind-key j select-pane -L
# bind-key k select-pane -R
# bind-key l select-pane -D
# bind-key -n M-h select-pane -L
# bind-key -n M-l select-pane -R
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
# read a pane's history while typing in it: a split above opens a frozen
# copy of the whole scrollback in less (at the bottom; / searches, q
# closes), and the pane below keeps its prompt and draft untouched. Made
# for answering a claude conversation's questions one by one. {last} is
# the pane split from, as the new pane takes focus.
bind-key v split-window -v -b -l 70% "tmux capture-pane -p -e -J -S - -t '{last}' | less -R +G"
# move between panes, as tmux's defaults: arrows by direction, o cycles, ;
# flips back to the last pane (the snapshot <-> the prompt after C-a v).
# No -r on the arrows: a repeat window would swallow the next Up/Down meant
# for the pane (claude's prompt history) right after a switch.
bind-key Up select-pane -U
bind-key Down select-pane -D
bind-key Left select-pane -L
bind-key Right select-pane -R
bind-key o select-pane -t :.+
bind-key \; last-pane
# prefix Tab: extrakto (vendored, pinned by its .upstream) opens fzf in a
# popup over the words, paths, URLs and lines of this window's panes, whole
# history included; Tab types the pick at the cursor, Enter copies it.
# Copies go through tmux's own OSC 52 (set-clipboard above), so over ssh
# they reach the local clipboard with no xclip on the box. Needs python3
# and fzf (nix/flake.nix). extrakto.tmux binds the key at load and reads
# its other options at every use.
set-option -g @extrakto_clip_mode tmux_osc52
run-shell "~/.dotfiles/home/.config/tmux/vendor/extrakto/extrakto.tmux"
# bind-key -n M-q confirm-before -p "kill-pane #P? (y/n)" kill-pane

bind-key -n C-u if-shell -F "#{alternate_on}" "send-keys C-u" "copy-mode -eu"
