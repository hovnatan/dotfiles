# glow (nix/flake.nix): terminal Markdown renderer. Linked by
# scripts/setup_user_symlinks.sh to where glow looks on each OS:
#   Linux  ~/.config/glow/glow.yml
#   macOS  ~/Library/Preferences/glow/glow.yml (XDG_CONFIG_HOME, when set,
#          wins there too; --config FILE is ignored as of glow 3.0.0)
# Without this file glow writes its own default there on first run, with
# width 80.

# Light or dark from the terminal background, like Ghostty's theme pair.
style: "auto"

# Word-wrap at 100, the line length markdownlint holds prose to
# (home/.config/markdownlint): glow 3.0.0 keeps every source line break, so
# at 80 each ~100-char source line split into a long line plus a short
# leftover. In a terminal under 100 columns it wraps mid-word instead.
width: 100

# Print straight to the terminal; `glow -p FILE.md` pages through $PAGER or
# `less -r` when a file is too long to scroll back through.
pager: false

# TUI-mode only (`glow` with no file): no mouse capture, so terminal
# selection keeps working; hidden and git-ignored files stay out of the list.
mouse: false
all: false
