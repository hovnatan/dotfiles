# mpv options (the Nix build, nix/flake.nix). Linked as ~/.config/mpv/mpv.conf,
# beside input.conf, scripts/ and shaders/ (scripts/setup_user_symlinks.sh).

# The libplacebo renderer, on Vulkan over Metal. mpv 0.42 picks it unasked;
# named here so a change of mpv's default does not change the picture.
vo=gpu-next

# Decode on the GPU (VideoToolbox) where the codec allows; mpv goes back to
# the CPU by itself where it does not. Measured on the M4 Pro, 20 s of
# playback, no dropped frames either way: 4K 10-bit HEVC at 45 Mbit/s took
# 5.1 s of CPU against 19.7 s; 1080p H.264 6.2 s against 7.5 s (2026-11-23).
hwdec=videotoolbox

# Quitting mid-file keeps the position, and opening the file again resumes
# there (~/.config/mpv/watch_later). Restrict what gets saved so temporary
# toggles (volume, mute, speed, sub-visibility from subback.lua) do not stick.
save-position-on-quit=yes
watch-later-options=start,vid,aid,sid,sub-delay,audio-delay

# Pause on the last frame instead of closing the window at EOF.
keep-open=yes

# Open > History and Open > Watch later in the menu (g-h and g-w): what was
# played (~/.config/mpv/watch_history.jsonl), and the files with a kept
# position. Off in mpv because both write file names to disk.
save-watch-history=yes
write-filename-in-watch-later-config=yes

# The History and Watch later lists (mpv's console) and the right-click menu
# at one size whatever the window's. mpv scales them with its height, 24 and
# 14 units of a 720-unit height: 9 and 5 pt in a 270 pt window. 36 and 21 pt
# are what full screen gives on a display 1080 pt high.
script-opts-append=console-scale_with_window=no
script-opts-append=console-font_size=36
script-opts-append=context_menu-scale_with_window=no
script-opts-append=context_menu-font_size=21
# The control bar stays 5 s after the mouse stops, where mpv's own 0.5 s
# hides it almost at once.
script-opts-append=osc-hidetimeout=5000
# It shows for a move of 5 px or more anywhere in the window: mpv's own shows
# for any move, a nudged mouse included, but only in the bottom quarter.
script-opts-append=osc-minmousemove=5
script-opts-append=osc-deadzonesize=0

# macOS windowing, input, and screenshots.
# Keep windowed 1080p/4K videos off the screen edges.
autofit-larger=90%x90%
# Treat Right Option as Alt (matching the PC-menu-key -> Right Option remap) so
# Alt+ bindings work with either Option key instead of composing characters.
input-right-alt-gr=no
# A held key starts repeating after half a second, not mpv's 200 ms, which a
# slow press reaches, and 10 times a second, not 40.
input-ar-delay=500
input-ar-rate=10
# Predictable screenshot destination whether launched from a shell or mpv.app.
screenshot-dir=~/Desktop

# Read-ahead cache for playback off the NAS over an SMB mount (Tailscale,
# ~145 ms RTT, ~9 MB/s, occasional multi-second stalls). mpv's default
# cache=auto enables the cache only for network URLs; an SMB-mounted file
# looks local to it and gets no cache, so a link stall is a playback stall.
# Force it on and let it read minutes ahead (bounded by the byte limits):
# a 20 GB 4K remux is ~10 MB/s, so 1 GiB is ~100 s of it, 1.25 GiB peak RAM.
cache=yes
demuxer-max-bytes=1024MiB
demuxer-max-back-bytes=256MiB
demuxer-readahead-secs=600

# Fill some cache before starting and when it runs dry, instead of
# stuttering frame by frame while it refills.
cache-pause-initial=yes
cache-pause-wait=3

# Bigger reads per syscall against a network filesystem.
stream-buffer-size=4MiB

# Picture. Most of it is for sources below the display's resolution: a 540p
# rip on the 4K display is scaled 4x each way.
# High-quality baseline, overridden toward neutral Filmmaker Mode defaults:
# ewa_lanczos removes ewa_lanczossharp's slight sharpening bias, and
# hdr-contrast-recovery=0 keeps HDR tone-mapping strictly global.
profile=high-quality
scale=ewa_lanczos
hdr-contrast-recovery=0
# Respect the macOS ColorSync display profile for SDR, and pass HDR/wide-gamut
# hints through to the display when supported ([hdr] below disables the SDR ICC
# profile on HDR sources so ColorSync does not double-manage or clip highlights).
icc-profile-auto=yes
target-colorspace-hint=auto
# Low-bitrate gradients (skies, fog) come out in steps; enabled automatically
# for sub-1080p sources in [deband-low-res] below, and toggled by hand with b
# (input.conf).
deband-iterations=2
deband-grain=24
# shaders/FSRCNNX_x2_8-0-4-1.glsl, a neural 2x upscaler, is not loaded here:
# on a low-bitrate rip it reads as too sharp. The u key switches it on
# (input.conf). Unmodified from github.com/igv/FSRCNN-TensorFlow,
# release 1.1 (LGPL 3).
# 24 fps on a 60 Hz display holds frames for 3 and 2 refreshes in turn, which
# judders in pans. Timing the video to the display and blending the frame
# that straddles a refresh evens it out; oversample keeps pans sharp without
# mitchell's motion blur.
video-sync=display-resample
interpolation=yes
tscale=oversample

# Default tracks: English audio and English subtitles, selected whatever the
# audio's language. mpv's prefix match lets "en" pick tracks tagged en-US and
# an external "<name>.en.srt".
alang=en
slang=en
# Selected but hidden, for listening first: v shows them, and Shift+LEFT
# shows the line just missed (scripts/subback.lua).
sub-visibility=no
sub-auto=fuzzy
sub-file-paths=Subs:subs:Subtitles:subtitles

# Subtitles: yellow Avenir Next Demi Bold, where mpv has white sans-serif
# (Helvetica on a Mac). Avenir's a, c, e, s are more open than Helvetica's. The weight is in the
# font's name, so sub-bold stays off.
sub-font=AvenirNext-DemiBold
# Sized for a 27-inch screen watched from 2 m: capitals come to about 21
# arcmin, the middle of the 20-22 that reads comfortably. Each step of 1 is
# 0.4 arcmin. Two lines take a seventh of the picture's height.
sub-font-size=51
sub-color=0.934/0.921/0.195
# Outline 2, not 3: at this weight a wider one thickens the letter shapes.
sub-outline-size=2
# Margin 30, where mpv has 34: at 22 descenders sat 3% of the height from
# the bottom edge.
sub-margin-y=30
# Off: -14 sets two lines 1.24 em apart at full screen on a 4K display, where
# the font's own spacing is 1.37. It is in screen pixels, so it squeezes
# harder in a smaller window, it applies to ASS subtitles whatever their font
# size, and a descender runs into an accented capital on the line below.
#sub-line-spacing=-14
# A small half-transparent shadow under the outline keeps the letters apart
# from a bright picture without widening the outline. sub-back-color is the
# shadow's color in mpv's default outline-and-shadow style.
sub-shadow-offset=1
sub-back-color=0/0/0/0.5

# Text a script draws (scripts/timeleft.lua), in the subtitles' font and size:
# a size is the font's ascent plus descent, 1.37 em in Avenir and 1.0 in mpv's
# default Helvetica, so 51 in Helvetica would stand 38% taller than the
# subtitles.
osd-font=AvenirNext-DemiBold
osd-font-size=51

# Deband only sub-1080p sources (e.g. 540p/720p rips), leaving 1080p Blu-rays
# (16:9, 2.39:1 scope, 4:3 Academy, slightly cropped, or vertical) and 4K
# remuxes with untouched film grain by default. Profiles live at the end of
# mpv.conf because everything after a [profile] header belongs to it.
[deband-low-res]
profile-cond=(width or 0) > 0 and width < 1900 and (height or 0) < 1060
profile-restore=copy
deband=yes

# HDR content: disable the SDR display ICC profile and pass HDR hints through
# to macOS EDR so ColorSync does not double-manage or clip highlights.
[hdr]
profile-cond=get("video-params/sig-peak", 0) > 1
profile-restore=copy
icc-profile-auto=no
target-colorspace-hint=yes
