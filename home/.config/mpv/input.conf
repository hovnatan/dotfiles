# mpv key bindings, on top of mpv's own (linked as ~/.config/mpv/input.conf).

Ctrl+Meta+v cycle video
Ctrl+Meta+s cycle sub
Ctrl+Meta+a cycle audio
SPACE script-binding pause-with-time-left
PLAYPAUSE script-binding pause-with-time-left
Meta+. stop
RIGHT seek 5
LEFT script-binding flash-subs-on-back
o script-binding show-time-left
Alt+RIGHT frame-step
Alt+LEFT frame-back-step
Shift+LEFT sub-seek -1
Shift+RIGHT sub-seek 1
FORWARD seek 15
REWIND seek -15
Meta+s screenshot
Meta+l ab-loop
Meta+L cycle-values loop-file "inf" "no"
Meta+RIGHT playlist-next
Meta+LEFT playlist-prev
Meta+> add chapter 1
Meta+< add chapter -1
Meta+[ multiply speed 0.5
Meta+] multiply speed 2.0
Alt+Meta+[ multiply speed 1/1.1
Alt+Meta+] multiply speed 1.1
Meta+\ set speed 1.0
Meta+0 set window-scale 0.5
Meta+1 set window-scale 1
Meta+2 set window-scale 2
Ctrl+Meta+f cycle fullscreen
Ctrl+Meta+t cycle ontop
UP add volume 5
DOWN add volume -5
Alt+UP add volume 1
Alt+DOWN add volume -1
Meta+/ cycle mute
( add audio-delay 0.5
) add audio-delay -0.5
Alt+( add audio-delay 0.1
Alt+) add audio-delay -0.1
_ set audio-delay 0
# Coarse subtitle delay (Shift+z/x/c); mpv's default lowercase z/x stay ±0.1.
Z add sub-delay -0.5
X add sub-delay 0.5
Alt+Z add sub-delay -0.1
Alt+X add sub-delay 0.1
C set sub-delay 0
ESC set fullscreen no
ENTER set fullscreen yes
# Quit without saving a Watch Later entry (q saves via save-position-on-quit).
Q delete-watch-later-config; set save-position-on-quit no; quit
# u: the neural 2x upscaler on or off, to compare by eye; off at start
# (mpv.conf). b: debanding on or off. Each says which it now is.
u no-osd change-list glsl-shaders toggle "~~/shaders/FSRCNNX_x2_8-0-4-1.glsl"; show-text "Upscaler ${?glsl-shaders==:off}${!glsl-shaders==:on}"
b no-osd cycle deband; show-text "Debanding ${?deband==yes:on}${!deband==yes:off}"
# y, beside u, i and o: the settings a key changes without saying where they stand.
y show-text "Volume ${volume}${?mute==yes: (muted)}\nSpeed ${speed}\nSub delay ${sub-delay}\nAudio delay ${audio-delay}" 4000
