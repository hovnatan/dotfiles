set-option -g prefix C-a

set-option -g default-command fish
set-option -g default-terminal "tmux-256color"

# Array options below are set at fixed indices from 100 up, not appended
# with -ga: a reload (prefix r) re-runs this file, and -ga added another
# copy of every entry each time (update-environment[13..33] held three).
# Plain -g on the whole option would instead replace tmux's defaults
# (SSH_AUTH_SOCK..., xterm*:clipboard:ccolour:cstyle:focus:title), which
# sit at the low indices and stay untouched.

# Refresh VS Code integration vars from the attaching client, like the
# built-in SSH_* handling: their socket paths die with each VS Code window
set-option -g update-environment[100] VSCODE_IPC_HOOK_CLI
set-option -g update-environment[101] VSCODE_GIT_IPC_HANDLE
set-option -g update-environment[102] GIT_ASKPASS
set-option -g update-environment[103] TERM_PROGRAM
set-option -g update-environment[104] TERM_PROGRAM_VERSION
set-option -g update-environment[105] BROWSER
# Truecolor for every outer terminal. This was ",$TERM*:RGB", but $TERM is
# the server's own environment, empty when systemd starts it
# (claude-tmux.service), so it already read "*:RGB" there.
set-option -g terminal-features[100] "*:RGB"
# Pass OSC 8 hyperlinks through (tmux >= 3.4 drops them otherwise): Claude Code
# draws markdown links as label-only OSC 8, so without this Ghostty has no url
# to open.  Open them with Cmd+Shift+click: `mouse on` below makes tmux capture
# plain clicks, and Shift is Ghostty's bypass for mouse capture.
set-option -g terminal-features[101] "*:hyperlinks"
# Shift+Enter, Ctrl+Enter and the like, told apart from their plain keys, for
# the panes that ask (Claude Code asks for modifyOtherKeys 2: Shift+Enter is
# its newline, plain Enter submits). With extended-keys off, tmux turns
# Shift+Enter into a plain Enter, so it submitted.
#
#   Ghostty --CSI 27;2;13~--> tmux --CSI 27;2;13~--> pane that asked
#                                  --CR------------> any other pane
#
# extkeys has tmux ask the terminal for modifyOtherKeys at attach; Ghostty's
# TERM (xterm-ghostty) and an ssh client's matches xterm*. `on`, not `always`:
# a program that never asked keeps getting the plain keys it understands.
set-option -g terminal-features[102] "xterm*:extkeys"
set-option -s extended-keys on
set-option -g history-limit 100000
set-option -g focus-events on
set-option -g history-file ~/.local/share/tmux_history
set-option -g escape-time 10
set-option -g wrap-search off
set-option -g mode-keys vi
set-option -g set-clipboard on     # sync tmux buffer with macOS clipboard
set-option -g mouse on

set-option -g exit-empty on

# Command-finish alerts: zsh and fish ring the bell for commands taking >1s
# (.zshrc.shared, fish config.fish), and Claude Code rings its own
# (preferredNotifChannel terminal_bell in ~/.claude/settings.json); pass it
# through to the outer terminal from any window.
# These are tmux defaults, set explicitly since the feature depends on them.
set-option -wg monitor-bell on
set-option -g bell-action any
set-option -g visual-bell off
# bell-action reaches only the clients of the session that rang, and a
# client in a background tab is no one looking: a bell in a session none of
# whose clients has focus (a Claude Code finishing in another tab, or with
# no client at all) is told to the terminals of the other sessions instead:
# a 5 s message "bell: <session>:<window> <name>" (see the script's header),
# and the @bell_marker on the right of the bar below until the session is
# looked at. The hook fires for every bell, in the window a client shows
# too (tested 2026-11-10, tmux 3.8); the script asks the clients' focus.
# @bell is the marker for a bell tmux keeps no alert of (one in a shown
# window); the hooks clearing it come after the focus timeline's below.
# #{q:} of an empty value expands to nothing, not '': a window whose name is
# empty (Claude Code clearing its title) cost the script its last argument,
# "returned 2". Hence "" for that case; == not #{?window_name}, as a window
# named "0" reads as false.
set-hook -g alert-bell 'run-shell -b "~/.dotfiles/home/.config/tmux/bell-elsewhere.sh #{q:socket_path} #{q:session_id} #{q:session_name} #{window_index} #{?#{==:#{window_name},},\"\",#{q:window_name}}"'
# Let panes send wrapped escape sequences through to the outer terminal:
# chafa's kitty-graphics images (fish functions/chafa.fish). Only while the
# pane is visible; `all` would also pass them from hidden panes.
set-option -g allow-passthrough on
# Sixel images (chafa -f sixels, from a client tmux detects sixel on)
# arrive as one escape sequence, and tmux silently drops any
# sequence over input-buffer-size (default 1 MB): a full-pane screenshot is
# ~1.9 MB of sixel, so it never appeared. Kitty passthrough is unaffected,
# chafa sends it in 4 KB chunks.
set-option -s input-buffer-size 16777216

# Claude Code drops its mobile push while the terminal reports focus, and
# an abruptly killed client (closed VS Code tab, dropped SSH) never sends
# the focus-out a graceful detach does -- the pane then looks watched
# forever and every push is suppressed. When a client goes away or
# switches session, synthesize the missing focus-out in every Claude Code
# pane of every clientless session (see the script's header).
set-hook -g client-detached 'run-shell "~/.dotfiles/home/.config/tmux/focus-out-unattached.sh #{socket_path}"'
set-hook -g client-session-changed 'run-shell "~/.dotfiles/home/.config/tmux/focus-out-unattached.sh #{socket_path}"'
# on every socket, each server for its own, what a pane left running in the
# background ends
# with it: the systemd scope of every pane gone is stopped (see the
# script's header), on whichever hook a close fires (tested 2026-10-28,
# tmux 3.7c):
#   its program exits -> pane-exited      kill-pane      -> after-kill-pane
#   kill-window       -> window-unlinked  kill-session   -> window-unlinked,
#                        (after-kill-window is no hook)     session-closed
# session-closed stays as a backstop beside the cold start's own pass.
set-hook -g session-closed 'run-shell -b "~/.dotfiles/home/.config/tmux/reap-panes.sh #{q:socket_path}"'
set-hook -g pane-exited 'run-shell -b "~/.dotfiles/home/.config/tmux/reap-panes.sh #{q:socket_path}"'
set-hook -g after-kill-pane 'run-shell -b "~/.dotfiles/home/.config/tmux/reap-panes.sh #{q:socket_path}"'
set-hook -g window-unlinked[0] 'run-shell -b "~/.dotfiles/home/.config/tmux/reap-panes.sh #{q:socket_path}"'
# A server's last session can take its hook with it, so each start sweeps up.
run-shell -b "~/.dotfiles/home/.config/tmux/reap-panes.sh #{q:socket_path}"

# Each server follows which window each session shows, for prefix C-s
# below (scripts/tmux_history.py; its docstring has the whole picture): a
# tracker of its own, started here and ended with the server. Only for a
# server in tmux's own socket folder (the default, -L <name>), not one on a
# path of its own (-S: tests, tools). Sourcing this file again starts one
# more, which finds the server tracked and exits. exec, so the SIGTERM tmux
# sends its jobs at exit reaches the tracker, not sh.
if -F '#{m:*/tmux-#{uid}/*,#{socket_path}}' 'run-shell -b "exec ~/.dotfiles/scripts/tmux_history.py run -S #{q:socket_path}"'

# Each such server also snapshots its sessions, and each window's directory,
# every 10 minutes, for `scripts/tmux_server_arrangement.py restore` after a
# reboot (its docstring has the whole picture): one run per server (a lock),
# started here and ended with the server, as the tracker above. Programs
# and splits are not saved: a restored window is a shell in its directory.
if -F '#{m:*/tmux-#{uid}/*,#{socket_path}}' 'run-shell -b "exec ~/.dotfiles/scripts/tmux_server_arrangement.py run -S #{q:socket_path}"'

# The terminal title names where the attach came from, this machine over ssh
# or "local": @title_host for set-titles-string below (see the script's
# header).
# Only for a client with a terminal: a control-mode client (tmux -C, as
# scripts/tmux_history.py keeps one) has none, and in these hooks its
# client_* formats are all empty (hook_client alone names it), so the
# script would get three arguments of five (tested 2026-11-09, tmux 3.8).
set-hook -g client-attached[0] 'if -F "#{client_tty}" "run-shell -b \"~/.dotfiles/home/.config/tmux/report-attach.sh #{q:socket_path} #{q:session_id} #{q:client_name} #{q:client_tty} attached\""'
set-hook -g client-session-changed[1] 'if -F "#{client_tty}" "run-shell -b \"~/.dotfiles/home/.config/tmux/report-attach.sh #{q:socket_path} #{q:session_id} #{q:client_name} #{q:client_tty} session-changed\""'

# A timeline of what each client's terminal tells tmux: focus in and out, and
# the detach that ends it (attaches and session switches are logged by the
# hook above). The ntfy hook decides "is anybody looking" from the focus
# tmux holds for a client, and a terminal can stop reporting it: tmux asks
# for focus reports once, at attach, and a terminal that resets its modes
# later never sends them again. In this log that shows as the focus lines
# of a client stopping while it stays attached (see log-event.sh). The
# client is hook_client, the one the hook ran for (its name is its tty):
# client_tty names whichever client tmux had last, so with two tabs attached
# the lines of both read the same, and a detached client has none left.
set-hook -g client-focus-in 'run-shell -b "~/.dotfiles/home/.config/tmux/log-event.sh focus-in #{q:hook_client} session=#{q:session_name}"'
set-hook -g client-focus-out 'run-shell -b "~/.dotfiles/home/.config/tmux/log-event.sh focus-out #{q:hook_client} session=#{q:session_name}"'
set-hook -g client-detached[1] 'run-shell -b "~/.dotfiles/home/.config/tmux/log-event.sh detached #{q:hook_client} session=#{q:session_name}"'
# A session's @bell (bell-elsewhere.sh) is cleared once one of its clients
# is attached, switched to it, or focused: someone looks at it again. The
# hook's own session is the one set-option -u acts on. These come after
# every set-hook of the same hook without an index, which replaces the
# whole array: above them a [1] or [2] was gone once the file was read.
set-hook -g client-attached[1] 'set-option -qu @bell'
set-hook -g client-session-changed[2] 'set-option -qu @bell'
set-hook -g client-focus-in[1] 'set-option -qu @bell'

# Light or dark follows the terminal that is attached. It reports its theme
# at attach and at every switch, and the links that Claude Code's theme and
# zathura read are pointed to match (scripts/appearance.sh). The report comes
# down the connection like a keystroke, so a machine reached over ssh
# follows the one at the keyboard with nothing pushed to it; on a Mac,
# Hammerspoon sets the same value from the system's. Two clients of
# different themes: the one that reported last wins. Output is dropped, as
# tmux would open it in the pane; an error still shows. No -b: a terminal
# reports three times at a switch, the old theme first, and each runs the
# script. In the background those runs race, and an old one finishing last
# left the links on the old theme while the bar went to the new one. Waiting
# keeps them in the order reported.
set-hook -g client-dark-theme 'run-shell "~/.dotfiles/scripts/appearance.sh dark >/dev/null"'
set-hook -g client-light-theme 'run-shell "~/.dotfiles/scripts/appearance.sh light >/dev/null"'
# Dim the panes that are not active with a background a shade off the
# terminal's, from gruvbox's own backgrounds so the dim stays warm: bg0_h
# (#1d2021) in dark, bg1 (#ebdbb2) in light. A neutral gray read as blue
# beside gruvbox's cream, and a cool dark one was blue outright. The active
# pane keeps the terminal's own, so a window of one pane is never dimmed:
# bg=terminal, as the active style is laid over window-style and its
# "default" would let the dim through.
# Text a program colours itself (most of Claude Code's) keeps its colour.
# Index 1, after the plain lines above: those replace the whole array.
set-option -g @dim_dark "bg=#1d2021"
set-option -g @dim_light "bg=#ebdbb2"
set-option -wg window-active-style bg=terminal
set-hook -g client-dark-theme[1] 'set-option -wgF window-style "#{@dim_dark}"'
set-hook -g client-light-theme[1] 'set-option -wgF window-style "#{@dim_light}"'
# A terminal reports its theme at attach and on a switch, not at a reload,
# so a reload (prefix r) applies the theme of the client that ran it. A
# server starting from this file has no client: the next attach sets it.
if-shell -F '#{==:#{client_theme},dark}' 'set-option -wgF window-style "#{@dim_dark}"'
if-shell -F '#{==:#{client_theme},light}' 'set-option -wgF window-style "#{@dim_light}"'
# What this file does not colour itself (copy-mode selection, search matches,
# messages, menus, popups) takes the terminal's ANSI colours, so it is gruvbox
# through Ghostty and follows Ghostty's theme. tmux 3.8's default, detect, uses
# its own fixed set instead: darkgoldenrod for the selection, not gruvbox yellow.
set-option -s theme terminal

# make `tmux ls` show the socket; index 10 keeps the built-in aliases (0-5) intact
set-option -g command-alias[10] 'ls=list-sessions -F "#{socket_path} | #{session_name}: #{session_windows} windows"'

# The status bar, on top in every session: the window list on the left,
# "0 * backend | 1 nvim: init.lua | 2 fish:~/x" (index, space, the name; a
# bar between windows, as between the stats and the date, since names hold
# colons and spaces of their own), the current window as a tab open onto
# the pane, a window that rang in red; on the right the terminal's title
# (set-titles-string below: the session, and over ssh the machine), CPU and
# memory use, then the date, time and zone:
#
#   0 * backend | 1 nvim: init.lua  (<host>) [main] | cpu 8.1% mem 74.0% | 03 Nov 17:58 EST
#
# and, while another session holds a bell, its marker first on the right:
#
#   0 * backend | 1 nvim  solo:1!  (<host>) [main] | cpu 8.1% mem 74.0% | ...
#
# The title is cut at 32 columns, and status-right-length leaves room for that
# much: tmux trims status-right from its end, so without both a long name would
# push out the clock, not itself.
#
# The zone is the tmux server's (EDT in summer, UTC on a VM left at UTC),
# read once at its start: a machine's zone changed later shows after the
# server restarts. A clock in each client's own zone is kept, not wired in:
# client-clock.sh (its header), which costs a process per client every
# status-interval; to use it, put
# `#(~/.dotfiles/home/.config/tmux/client-clock.sh #{client_pid})` in place
# of `%d %b %H:%M %Z` below.
# CPU and memory: home/.config/tmux/status-stats.sh, which labels what
# tmux-mem-cpu-load (nix/flake.nix) measures. tmux runs it in the
# background every status-interval (15 s), so the bar never waits on it;
# a failure prints its reason in place of the numbers.
#
# prefix S hides the bar for the current session (a VS Code terminal,
# where the row is unwanted) and shows it again. `status` is a session
# option: every client of the session sees the same bar, so hiding it for
# VS Code hides it in the Ghostty tab on that session too (tmux has no
# per-client status).
set-option -g status on
set-option -g status-position top
set-option -g status-left ""
# @bell_marker, first on the right: the other sessions holding a bell, each
# in the bell red of window-status-bell-style below, e.g. " solo:1! " for a
# bell in window 1 of session solo, its name cut at 16 columns.
# #{session_alerts} is tmux's own (! bell, # activity, ~ silence; cleared
# once a client shows the window), @bell ("0!") the window of a bell rung
# where an unfocused client looked (bell-elsewhere.sh, cleared by its hooks
# above; "0" alone would read as false), shown only while no input reached
# the session since (@bell_at >= #{session_activity}): a terminal whose focus
# reports stopped never sends the focus-in that clears it, but its keys
# still count. Empty when there is none. The client's own session is left
# out: its windows' labels show their bells already. status-right-length
# holds the 80 columns of the rest and three markers: tmux trims from the
# end, so a fourth would push out the clock.
set-option -g @bell_marker "#{S:#{?#{&&:#{||:#{session_alerts},#{&&:#{@bell},#{e|>=:#{@bell_at},#{session_activity}}}},#{!=:#{session_name},#{client_session}}},#[fg=#fbf1c7#,bg=#cc241d#,bold] #{=/16/...:session_name}:#{?session_alerts,#{session_alerts},#{@bell}} #[default] ,}}"
set-option -g status-right "#{E:@bell_marker}#{T;=/32/...:set-titles-string} | #(~/.dotfiles/home/.config/tmux/status-stats.sh) | %d %b %H:%M %Z "
set-option -g status-right-length 140
set-option -g status-justify left
# The bar is a filled row, nvim's StatusLine in gruvbox (fg1 on bg2), so it
# reads as a separator from the pane below with no row of its own. tmux has
# no status border; an underscore in the style was tried and looked like
# underlined text. These two values are all the bar's look: for no fill, set
# both to fg=#928374,bg=default, the gray of the pane borders. It follows the
# client's theme as the dimmed panes do (the block above): index 2, after
# their hooks. The default comes first and the reload lines after it, or a
# reload would leave the dark bar on a light terminal.
set-option -g @bar_dark "fg=#ebdbb2,bg=#504945"
set-option -g @bar_light "fg=#3c3836,bg=#d5c4a1"
set-option -gF status-style "#{@bar_dark}"
set-hook -g client-dark-theme[2] 'set-option -gF status-style "#{@bar_dark}"'
set-hook -g client-light-theme[2] 'set-option -gF status-style "#{@bar_light}"'
if-shell -F '#{==:#{client_theme},dark}' 'set-option -gF status-style "#{@bar_dark}"'
if-shell -F '#{==:#{client_theme},light}' 'set-option -gF status-style "#{@bar_light}"'
set-option -g window-status-format "#I #W"
set-option -g window-status-current-format "#I #W"
# the current window: the terminal's own colours, as the active pane's, so it
# reads as a tab open onto the pane below in either theme with no theme hooks.
# "terminal", not "default": default here is the bar's fill. The border orange
# read at 2.3:1 straight on that fill.
set-option -g window-status-current-style fg=terminal,bg=terminal
# a window that rang: gruvbox red behind its label, the text gruvbox cream, which reads
# on that red whichever theme the terminal is in
set-option -g window-status-bell-style fg=#fbf1c7,bg=#cc241d,bold
set-option -g window-status-separator " | "
set-option -g renumber-windows on

# the active pane's border in gruvbox orange, the rest in gruvbox gray: both
# read on the light and the dark background (appearance follows the client,
# above). tmux draws borders only between panes, so a lone pane has none.
# With two panes the line they share is coloured on the active pane's half.
set-option -g pane-border-lines heavy
set-option -g pane-border-style fg=#928374
set-option -g pane-active-border-style fg=#d65d0e
set-option -g set-titles on
set-option -g automatic-rename on
set-option -g allow-rename on
# A window is named after the title its program reports (OSC 0/2), as is:
#
#   program        pane_title                window name
#   fish (idle)    "fish:~/.dotfiles"   ->   fish:~/.dotfiles
#   fish running   "make"               ->   make
#   nvim           "nvim: init.lua"     ->   nvim: init.lua
#   Claude Code    "* vm/backend/fix"   ->   * vm/backend/fix  (the glyph is
#                                            its spinner: the bar redraws
#                                            with it while CC works)
#
# A program that sets no title, started straight into a window (`tmux
# new-window htop`), leaves tmux's initial title, the host name; such a
# window is named after the program instead. The rest is tmux's default:
# [tmux] in copy mode, [dead].
set-option -g automatic-rename-format "#{?pane_in_mode,[tmux],#{?#{==:#{pane_title},#{host}},#{pane_current_command},#{pane_title}}}#{?pane_dead,[dead],}"

# the terminal title is the whole session name in brackets, "[main]", on any
# socket, led by where the attach came from (@title_host, set by the hooks
# above), as the shells' titles are: "(<host>) [main]" over ssh, "(local)
# [main]" otherwise.
# scripts/lib/tmux_arrangement.py reads these titles back (tmux_session), and
# the bar's status-right draws the same string.
set-option -g set-titles-string "#{?@title_host,(#{@title_host}) ,}[#{session_name}]"

unbind -aq -T prefix
unbind -aq -T root
unbind -aq -T copy-mode

# Ctrl-d must not close Claude Code: it quits on a second press, and that key is
# hardcoded (keybindings.json refuses it), so tmux stops it first. Delete takes its
# place, which keeps the forward-delete Ctrl-d does on a line with text. Every other
# program gets the real Ctrl-d. The pane's command is `claude` on Linux and the
# version (`2.1.318`) on macOS, where the binary is named after it.
bind-key -n C-d if-shell -F '#{m/r:^(claude|[0-9]+\.[0-9]+\.[0-9]+)$,#{pane_current_command}}' 'send-keys DC' 'send-keys C-d'

bind-key C-a send-prefix
# The pickers leave out tmux-history, the session scripts/tmux_history.py's
# control client sits in: nothing to see or switch to there.
bind-key s choose-tree -Zs -f '#{!=:#{session_name},tmux-history}'
bind-key d detach-client
bind-key [ copy-mode
bind-key ] paste-buffer -p
bind-key : command-prompt

bind-key r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

bind-key R attach -d
# prefix k: an empty screen and no history. The Ctrl-l goes first: the
# program clears its screen, and tmux scrolls a cleared screen into history
# (scroll-on-clear), so history cleared before it kept that one screen. The
# 0.2 s is for the program to handle the key, which send-keys does not wait for.
bind-key k send-keys C-l \; run-shell -d 0.2 \; clear-history

# The notch that opens copy mode moves 5 lines, the step copy-mode-vi's own wheel takes.
bind-key -n WheelUpPane if-shell -F "#{alternate_on}" "send-keys -M" "select-pane -t= \; copy-mode -e \; send-keys -X -N 5 scroll-up"
# a click makes the pane under it active, and still reaches the program in
# it (tmux's default, which the unbind of the root table above removed)
bind-key -n MouseDown1Pane select-pane -t= \; send-keys -M
# A click on a window in the bar selects it. This is tmux's default binding, restored
# because the `unbind -aq -T root` above clears it.
bind-key -n MouseDown1Status switch-client -t=
# Ctrl-click on a window in the bar swaps it with the current one: tmux's default again.
bind-key -n C-MouseDown1Status swap-window -t@
# Dragging the border between two panes resizes them: tmux's default again.
bind-key -n MouseDrag1Border resize-pane -M
bind-key / copy-mode \; command-prompt -p "(search up)" "send -X search-backward \"%%%\""
bind-key C command-prompt -p "Enter session name:" "new-session -s '%%'"

# Windows inside a session (see the status bar block above). In a claude
# session claude's shell is window 0 while it lives: it is created first, and
# renumber-windows closes the gaps a closed window leaves, so when that shell
# exits the next window becomes 0. prefix l goes to the window this session
# showed before (tmux's own last-window). prefix C-s goes back to the window
# this session left last after showing it a second or more, past a window
# passed through on the way (a stay of a fraction of a second). The
# server's tracker (above) keeps each session's stays and answers the key,
# which hands it the terminal and its window in buffer tmux-history-ask
# (why a buffer: the tracker's docstring). Session tmux-history is there
# exactly while a tracker is connected; without one the key says so.
#
#   api:1 (2 min) -> api:2 (0.3 s) -> api:3       prefix C-s: api:1
#                                                 prefix l:   api:2
# prefix c opens the new window right after the current one, the rest moving up one:
# from 0 of `0 1 2` the new window is 1, and the old 1 and 2 become 2 and 3.
bind-key c new-window -a -c "#{pane_current_path}"
bind-key n next-window
bind-key p previous-window
bind-key C-s if-shell -F '#{S:#{?#{==:#{session_name},tmux-history},1,}}' {
  run-shell -C "set-buffer -b tmux-history-ask '#{client_name} #{session_id}:#{window_id}'"
} {
  display-message "tmux history: no tracker on this server; why: ~/.dotfiles/.logs/*_tmux_history/events.log"
}
bind-key l last-window
# prefix L: the session this client showed before, as l is for windows
bind-key L switch-client -l
bind-key w choose-tree -Zw -f '#{!=:#{session_name},tmux-history}'
bind-key 0 select-window -t :=0
bind-key 1 select-window -t :=1
bind-key 2 select-window -t :=2
bind-key 3 select-window -t :=3
bind-key 4 select-window -t :=4
bind-key 5 select-window -t :=5
bind-key 6 select-window -t :=6
bind-key 7 select-window -t :=7
bind-key 8 select-window -t :=8
bind-key 9 select-window -t :=9
# hide or show this session's status bar, for a view where the row is
# unwanted (a VS Code terminal)
bind-key S if-shell -F "#{==:#{status},off}" "set-option -u status" "set-option status off"
# Cmd-J / Cmd-K: previous / next window. A Mac terminal never passes Cmd to
# the program, so Ghostty sends these two sequences for them
# (home/.config/ghostty/config), which tmux
# reads as the keys User0 / User1. Outside tmux fish ignores both. A session
# of one window does nothing, rather than flash "No next window".
# Known gaps: outside tmux, programs that do not skip unknown CSI sequences
# act on them (bash's readline inserts "30001~"; vim and REPLs vary, and
# were not checked); and a tmux nested in a pane (ssh to a box running its
# own) never sees them, as this one takes them first.
#
#   Cmd-J -> \e[5;30001~ -> User0 -> previous-window
#   Cmd-K -> \e[5;30002~ -> User1 -> next-window
set-option -s user-keys[0] "\e[5;30001~"
set-option -s user-keys[1] "\e[5;30002~"
bind-key -n User0 if-shell -F "#{e|>:#{session_windows},1}" previous-window
bind-key -n User1 if-shell -F "#{e|>:#{session_windows},1}" next-window

bind-key -T copy-mode-vi "v" send -X begin-selection
bind-key -T copy-mode-vi "Y" send-keys -X copy-pipe-and-cancel "tmux paste-buffer"
# y reaches the system clipboard too, by OSC 52 (set-clipboard above), over ssh as well
bind-key -T copy-mode-vi y send-keys -X copy-selection

bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
# read a pane's history while typing in it: a split above opens a frozen
# copy of the whole scrollback in less (at the bottom; / searches, q
# closes), and the pane below keeps its prompt and draft untouched. Made
# for answering a claude conversation's questions one by one. {last} is
# the pane split from, as the new pane takes focus.
bind-key v split-window -v -b -l 70% "tmux capture-pane -p -e -J -S - -t '{last}' | less -R +G"
# move between panes, as tmux's defaults: arrows by direction, o cycles, ;
# flips back to the last pane (the snapshot <-> the prompt after C-a v).
# No -r on the arrows: a repeat window would swallow the next Up/Down meant
# for the pane (claude's prompt history) right after a switch.
bind-key Up select-pane -U
bind-key Down select-pane -D
bind-key Left select-pane -L
bind-key Right select-pane -R
bind-key o select-pane -t :.+
bind-key \; last-pane
# prefix z: the current pane fills the window, and back; prefix x closes it,
# after a y. Both are tmux's defaults, gone with the unbind of the prefix table.
bind-key z resize-pane -Z
bind-key x confirm-before -p "kill-pane #P? (y/n)" kill-pane
# prefix Tab: extrakto (vendored, pinned by its .upstream) opens fzf in a
# popup over the words, paths, URLs and lines of this window's panes, whole
# history included; Enter types the pick at the cursor, Tab copies it
# (swapped from extrakto's defaults: inserting is the common case).
# Copies go through tmux's own OSC 52 (set-clipboard above), so over ssh
# they reach the local clipboard with no xclip on the box. Needs python3
# and fzf (nix/flake.nix). extrakto.tmux binds the key at load and reads
# its other options at every use.
set-option -g @extrakto_clip_mode tmux_osc52
set-option -g @extrakto_insert_key enter
set-option -g @extrakto_copy_key tab
run-shell "~/.dotfiles/home/.config/tmux/vendor/extrakto/extrakto.tmux"

# Ctrl-u opens copy mode half a page up, the step it and Ctrl-d take inside copy mode.
# -e leaves copy mode on reaching the bottom again. Full-screen programs get the real key.
bind-key -n C-u if-shell -F "#{alternate_on}" "send-keys C-u" "copy-mode -e \; send-keys -X halfpage-up"
