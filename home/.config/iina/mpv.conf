# mpv options for IINA (loaded because IINA's "config directory" preference
# points at ~/.config/iina, a symlink to this directory).

# Read-ahead cache for playback off the NAS over an SMB mount (Tailscale,
# ~145 ms RTT, ~9 MB/s, occasional multi-second stalls). mpv's default
# cache=auto enables the cache only for network URLs; an SMB-mounted file
# looks local to it and gets no cache, so a link stall is a playback stall.
# Force it on and let it read minutes ahead (bounded by the byte limits):
# a 20 GB 4K remux is ~10 MB/s, so 1 GiB is ~100 s of it, 1.25 GiB peak RAM.
cache=yes
demuxer-max-bytes=1024MiB
demuxer-max-back-bytes=256MiB
demuxer-readahead-secs=600

# Fill some cache before starting and when it runs dry, instead of
# stuttering frame by frame while it refills.
cache-pause-initial=yes
cache-pause-wait=5

# Bigger reads per syscall against a network filesystem.
stream-buffer-size=4MiB
