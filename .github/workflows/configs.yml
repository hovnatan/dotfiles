# Parse checks for fish, JSON and the nvim config, plus fish's layout
# (scripts/check_configs.sh says what each covers): scripts/check.sh's
# `configs` check, which the pre-push hook runs too. fish and nvim come from the pinned nixpkgs
# (nix/flake.lock), the builds dotup installs, so CI parses with the same
# versions the machines run; git and python3 are the runner's.
name: configs
on:
  push:
    branches: [main]
  pull_request:
jobs:
  configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: scripts/check.sh configs
        run: |
          nix shell --inputs-from "path:$PWD/nix" nixpkgs#fish nixpkgs#neovim --command bash -c \
            "fish --version && nvim --version | head -1 && scripts/check.sh configs"
