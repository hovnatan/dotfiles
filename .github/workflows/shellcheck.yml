# Lint every tracked shell script at warning level, the bar set in commit
# d67fc4a2 and documented in .shellcheckrc. Info/style notes stay advisory.
name: shellcheck
on:
  push:
    branches: [main]
  pull_request:
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version
      - run: git ls-files '*.sh' | grep -v '^scripts/countdown.sh$' | xargs shellcheck -S warning
