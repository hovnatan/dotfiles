# Lint every tracked shell script at warning level, the bar set in commit
# a53d141b and documented in .shellcheckrc (info/style notes stay advisory),
# and reject a bare GNU `timeout`: scripts/check.sh's `shell` check, which
# the pre-push hook runs too.
name: shellcheck
on:
  push:
    branches: [main]
  pull_request:
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck --version
      - run: scripts/check.sh shell
